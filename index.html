<!doctype html>

    <script>
      /* movimento reduzido antes da primeira pintura: escolha salva no rodape, senao a do sistema */
      (function () {
        var m;
        try {
          m = localStorage.getItem("motion");
        } catch (e) {}
        if (m ? m === "reduce" : matchMedia("(prefers-reduced-motion: reduce)").matches)
          document.documentElement.classList.add("rm");
      })();
    </script>
  </head>
  <body>
    <canvas id="cv" aria-hidden="true"></canvas>
    <header class="nav">
      <a class="logo" id="brand" href="#">VELURA</a>
      <nav class="nl" aria-label="Sections">
        <a href="#s1" data-go="s1" data-t="nv1"></a>
        <a href="#s4" data-go="s4" data-t="nv2"></a>
        <a href="#details" data-go="details" data-t="sh"></a>
        <a href="#faq" data-go="faq" data-t="nv3"></a>
      </nav>
      <div class="nr">
        <div class="lang" role="group" aria-label="Language">
          <button data-l="en" aria-pressed="true">EN</button
          ><button data-l="pt" aria-pressed="false">PT</button
          ><button data-l="es" aria-pressed="false">ES</button>
        </div>
        <button class="bag" id="bag"><span data-t="bag"></span> (<span id="cnt">0</span>)</button>
      </div>

    <!-- indice dos capitulos (como as salas do Cartier): o capitulo atual acende; ver chapters() no main.js -->

      <a href="#s1" data-go="s1"><b>01</b><span data-t="n1"></span></a>
      <a href="#s2" data-go="s2"><b>02</b><span data-t="n2"></span></a>
      <a href="#s3" data-go="s3"><b>03</b><span data-t="n3"></span></a>
      <a href="#s4" data-go="s4"><b>04</b><span data-t="n4"></span></a>
    </nav>
    <div id="hsw">
      <button class="hs off" data-k="foil" aria-label="Foil head"><i data-t="ix1"></i></button
      ><button class="hs off" data-k="round" aria-label="Round head"><i data-t="ix2"></i></button
      ><button class="hs off" data-k="body" aria-label="Handle"><i data-t="ix3"></i></button
      ><button class="hs off" data-k="btn" aria-label="Power button"><i data-t="ix4"></i></button
      ><button class="hs off" data-k="led" aria-label="Battery display"><i data-t="ix5"></i></button
      ><button class="hs off" data-k="port" aria-label="Charging port"><i data-t="ix6"></i></button>
    </div>

        <div class="pin">
          <img class="poster" id="poster" src="img/poster.webp" width="1080" height="1080" alt="" />
          <div class="tx">
            <p class="eye" data-t="eye"></p>
            <h1>
              <span><i data-t="h1a"></i></span><span><i data-t="h1b"></i></span>
            </h1>
            <p data-t="lede"></p>
            <div class="hp" id="hprice"></div>
            <div class="ctas">
              <button class="btn solid" id="hadd" data-t="add"></button
              ><a class="btn" href="#s1" data-go="s1" data-t="c1"></a>
            </div>
          </div>
          <div class="fin" id="fin" role="group" aria-label="Color" hidden>
            <button class="btn" data-c="pink" aria-pressed="true" data-t="cp"></button
            ><button class="btn" data-c="blue" aria-pressed="false" data-t="cb"></button>
          </div>
          <div class="scrl" aria-hidden="true"><span data-t="scr"></span><i></i></div>
        </div>
      </section>
      <section class="sc" id="s1" style="height: 240vh">

          <div class="tx">
            <p class="cn">01</p>

            <p data-t="c1p"></p>
          </div>
        </div>

            <h2 data-t="h2a"></h2>
            <p data-t="p2"></p>
            <div id="hcap"></div>
          </div>
        </div>
      </section>
      <section class="sc x3d" id="s3" style="height: 260vh">
        <div class="pin">
          <!-- area para arrastar e girar o aparelho (touch-action: pan-y deixa a pagina rolar na vertical) -->
          <div class="drag" id="drag" aria-hidden="true"></div>
          <div class="tx">
            <p class="cn">03</p>
            <h2 data-t="h3a"></h2>
            <p data-t="p3"></p>
            <div class="ctas"><button class="btn solid hold" id="hold" data-t="hold"></button></div>
            <ol class="ix" id="ix">
              <li>
                <button data-k="foil"><b>01</b><span data-t="ix1"></span></button>

              <li>
                <button data-k="round"><b>02</b><span data-t="ix2"></span></button>
              </li>
              <li>
                <button data-k="body"><b>03</b><span data-t="ix3"></span></button>
              </li>
              <li>
                <button data-k="btn"><b>04</b><span data-t="ix4"></span></button>
              </li>
              <li>
                <button data-k="led"><b>05</b><span data-t="ix5"></span></button>
              </li>
              <li>
                <button data-k="port"><b>06</b><span data-t="ix6"></span></button>
              </li>
            </ol>
          </div>
        </div>
      </section>
      <section class="sc" id="s4" style="height: 240vh">
        <div class="pin">
          <div class="tx">
            <p class="cn">04</p>
            <h2 data-t="hw"></h2>
            <ol class="steps">
              <li><b>01</b><div><h3 data-t="hw1t"></h3><p data-t="p5"></p><p id="cab" data-t="cab" hidden></p></div></li>
              <li><b>02</b><div><h3 data-t="hw2t"></h3><p data-t="hw2p"></p></div></li>
              <li><b>03</b><div><h3 data-t="hw3t"></h3><p data-t="hw3p"></p></div></li>
            </ol>
          </div>
        </div>
      </section>
      <section class="sc buyx" id="s5">
        <div id="buy">
          <h2 data-t="h6a"></h2>
          <dl>
            <div>
              <dt data-t="f1l"></dt>
              <dd data-t="f1v"></dd>
            </div>
            <div>
              <dt data-t="f2l"></dt>

          </div>
          <div class="pr" id="price"></div>
          <div class="qr">
            <div class="qt">
              <button id="qm" aria-label="−">−</button><output id="qv">1</output
              ><button id="qp" aria-label="+">+</button>
            </div>
            <button class="btn solid" id="add" data-t="add"></button>

              <span class="tl" data-t="s3l"></span>

            </div>

            <div class="ai rv" style="--i: 4">
              <button class="aq" id="aq4" aria-expanded="false" aria-controls="ap4">

          <div class="logo" data-brand></div>

    <div class="bar" id="bar">
      <div class="bp" id="bprice"></div>
